name: Release plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Init GenOffice vendor
        run: node scripts/setup-genoffice.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          for id in docx xlsx pptx pdf; do
            version=$(node -p "require('./packages/${id}/package.json').version")
            if [ "v${version}" != "${{ github.ref_name }}" ]; then
              echo "tag ${{ github.ref_name }} does not match packages/${id} version ${version}" >&2
              exit 1
            fi
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify URA contract
        run: pnpm verify

      - name: Pack plugin zips
        run: pnpm pack:plugins

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
