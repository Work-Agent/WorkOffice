name: Release plugins

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin zips
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 拿不到固定版本的 wasm 就让构建/自检失败：不允许静默降级成「读整份字节」模式。
      XLSX_REQUIRE_WASM: '1'

    steps:
      - name: Checkout plugins
        uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0

      - name: Check PluginRegistry App secrets
        env:
          APP_CLIENT_ID: ${{ secrets.REGISTRY_APP_CLIENT_ID || vars.REGISTRY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Missing REGISTRY_APP_CLIENT_ID / REGISTRY_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Create PluginRegistry app token
        id: registry-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REGISTRY_APP_CLIENT_ID || vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: Work-Agent
          repositories: PluginRegistry
          permission-contents: write
          permission-pull-requests: write

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Init GenOffice vendor
        working-directory: plugin
        run: node scripts/setup-genoffice.mjs

      - name: Install dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      # ── xlsx wasm 引擎：优先用 wasm.lock.json 固定的产物；拿不到才在 runner 上编译 ──
      # 编译时编译器必须钉死（wasm.lock.json → compile.rustc）：Rust 1.100.0 起 wasm32-wasip1
      # 会链接 crt1-reactor.o（自带 _initialize），和 packages/xlsx/rust/xlsx-engine/wasm.rs
      # 显式导出的 _initialize 撞 duplicate symbol。用 RUSTUP_TOOLCHAIN 钉，不改 runner default。
      - name: xlsx wasm engine (pinned download)
        id: wasm-pin
        continue-on-error: true
        working-directory: plugin/packages/xlsx
        env:
          XLSX_ENGINE_WASM: fetch
          XLSX_ENGINE_WASM_URL: ${{ vars.XLSX_ENGINE_WASM_URL }}
        run: node scripts/fetch-wasm.mjs --require

      - name: Setup Rust (fallback compiler)
        if: steps.wasm-pin.outcome == 'failure'
        run: |
          set -euo pipefail
          CHANNEL="$(node -e "const l=require('./plugin/packages/xlsx/wasm.lock.json'); const c=l.compile?.rustc; if(!c) throw new Error('wasm.lock.json 缺 compile.rustc'); console.log(c)")"
          echo "pinned rust channel: $CHANNEL"
          if ! rustup toolchain list | grep -q "^${CHANNEL}-"; then
            rustup toolchain install "$CHANNEL" --profile minimal --target wasm32-wasip1 --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=${CHANNEL}" >> "$GITHUB_ENV"

      # cargo 冷编译 ~4 分钟；缓存 registry + 我们自己的 target 目录，第二次起是秒级。
      - name: Cache cargo (xlsx wasm engine)
        if: steps.wasm-pin.outcome == 'failure'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            plugin/packages/xlsx/build/xlsx-engine-wasm/target
          key: xlsx-wasm-${{ runner.os }}-${{ hashFiles('plugin/packages/xlsx/wasm.lock.json', 'plugin/vendor/genoffice/apps/sheets/native/xlsx-engine/Cargo.lock', 'plugin/packages/xlsx/rust/xlsx-engine/wasm.rs') }}
          restore-keys: |
            xlsx-wasm-${{ runner.os }}-

      - name: xlsx wasm engine (compile fallback)
        if: steps.wasm-pin.outcome == 'failure'
        working-directory: plugin/packages/xlsx
        env:
          XLSX_ENGINE_WASM: build
        run: node scripts/ensure-wasm.mjs --require


      # 四个插件共用同一个 tag：版本必须全部一致，否则一个 Release 里会混版本。
      - name: Validate release tag
        working-directory: plugin
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            ID="$(node -p "const p=require('./${dir}package.json'); (p.workstudio && p.workstudio.id) || ''")"
            [ -n "$ID" ] || continue
            VERSION="$(node -p "require('./${dir}package.json').version")"
            # 允许 0.2 这样的短 tag 对应 package.json 的 0.2.0。
            if [ "$TAG" != "$VERSION" ] && [ "${TAG}.0" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match ${ID} version $VERSION"
              exit 1
            fi
          done

      - name: Typecheck
        working-directory: plugin
        run: pnpm typecheck

      - name: Build
        working-directory: plugin
        run: pnpm build

      - name: Verify plugins
        working-directory: plugin
        run: pnpm verify

      - name: Test plugins
        working-directory: plugin
        run: pnpm test

      - name: Pack plugin zips
        working-directory: plugin
        run: |
          set -euo pipefail
          rm -rf release
          pnpm pack:plugins

      # 校验发布包：条目齐全 / 清单正确 / sha256 内容比对（脚本用 node 读 zip，
      # 不再用 `unzip -l | grep -q`——那在 `set -o pipefail` 下会因 SIGPIPE(141) 假失败）。
      - name: Verify plugin zips
        working-directory: plugin
        run: node scripts/verify-zips.mjs

      - name: Collect release metadata
        id: meta
        working-directory: plugin
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/pdf/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## WorkStudio Office 插件 \`$VERSION\`"
            echo
            echo "| 插件 | zip | sha256 |"
            echo "| --- | --- | --- |"
            for dir in packages/*/; do
              ID="$(node -p "const p=require('./${dir}package.json'); (p.workstudio && p.workstudio.id) || ''")"
              [ -n "$ID" ] || continue
              ZIP="${ID}-${VERSION}.zip"
              SHA="$(tr -d '[:space:]' < "release/${ZIP}.sha256")"
              URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
              echo "| \`$ID\` | [\`$ZIP\`]($URL) | \`$SHA\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            plugin/release/*.zip
            plugin/release/*.sha256

      - name: Checkout plugin registry
        uses: actions/checkout@v7
        with:
          repository: Work-Agent/PluginRegistry
          path: PluginRegistry
          token: ${{ steps.registry-app.outputs.token }}
          fetch-depth: 0

      - name: Write plugin registry entries
        working-directory: plugin
        env:
          REGISTRY_DIR: ${{ github.workspace }}/PluginRegistry
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/write-registry-entry.mjs

      - name: Validate plugin registry
        working-directory: PluginRegistry
        run: npm run validate

      - name: Open PluginRegistry pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.registry-app.outputs.token }}
          path: PluginRegistry
          base: main
          branch: release/office-plugins-${{ steps.meta.outputs.version }}
          delete-branch: true
          commit-message: 'chore: add office plugins ${{ steps.meta.outputs.version }}'
          title: 'chore: add office plugins ${{ steps.meta.outputs.version }}'
          body: |
            Automated release from [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}).

            - Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            - Version: `${{ steps.meta.outputs.version }}`
            - 插件：`docx` / `xlsx` / `pptx` / `pdf`（每个 zip 与 sha256 见 Release）

            条目由 `scripts/write-registry-entry.mjs` 生成，`sha256` 固定本次产物。
          add-paths: |
            plugins/docx.json
            plugins/xlsx.json
            plugins/pptx.json
            plugins/pdf.json
