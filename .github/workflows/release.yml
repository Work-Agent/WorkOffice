name: Release plugins

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin zips
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout plugins
        uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0

      - name: Check PluginRegistry App secrets
        env:
          APP_CLIENT_ID: ${{ secrets.REGISTRY_APP_CLIENT_ID || vars.REGISTRY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Missing REGISTRY_APP_CLIENT_ID / REGISTRY_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Create PluginRegistry app token
        id: registry-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REGISTRY_APP_CLIENT_ID || vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: Work-Agent
          repositories: PluginRegistry
          permission-contents: write
          permission-pull-requests: write

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Init GenOffice vendor
        working-directory: plugin
        run: node scripts/setup-genoffice.mjs

      - name: Install dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Install wasm target
        run: rustup target add wasm32-wasip1

      # 四个插件共用同一个 tag：版本必须全部一致，否则一个 Release 里会混版本。
      - name: Validate release tag
        working-directory: plugin
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            ID="$(node -p "const p=require('./${dir}package.json'); (p.workstudio && p.workstudio.id) || ''")"
            [ -n "$ID" ] || continue
            VERSION="$(node -p "require('./${dir}package.json').version")"
            # 允许 0.2 这样的短 tag 对应 package.json 的 0.2.0。
            if [ "$TAG" != "$VERSION" ] && [ "${TAG}.0" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match ${ID} version $VERSION"
              exit 1
            fi
          done

      - name: Typecheck
        working-directory: plugin
        run: pnpm typecheck

      - name: Build
        working-directory: plugin
        run: pnpm build

      - name: Verify plugins
        working-directory: plugin
        run: pnpm verify

      - name: Test plugins
        working-directory: plugin
        run: pnpm test

      - name: Pack plugin zips
        working-directory: plugin
        run: |
          set -euo pipefail
          rm -rf release
          pnpm pack:plugins

      - name: Verify plugin zips
        working-directory: plugin
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            ID="$(node -p "const p=require('./${dir}package.json'); (p.workstudio && p.workstudio.id) || ''")"
            [ -n "$ID" ] || continue
            VERSION="$(node -p "require('./${dir}package.json').version")"
            ZIP="release/${ID}-${VERSION}.zip"

            [ -f "$ZIP" ] || { echo "::error::missing $ZIP"; exit 1; }
            [ -f "${ZIP}.sha256" ] || { echo "::error::missing ${ZIP}.sha256"; exit 1; }
            unzip -l "$ZIP"

            unzip -l "$ZIP" | grep -q 'dist/engine.js'
            unzip -l "$ZIP" | grep -q 'dist/page/index.html'
            unzip -l "$ZIP" | grep -q 'skills/'
            unzip -l "$ZIP" | grep -q 'package.json'

            ID="$ID" VERSION="$VERSION" unzip -p "$ZIP" package.json | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d));
              process.stdin.on("end", () => {
                const pkg = JSON.parse(s);
                if (pkg.workstudio?.id !== process.env.ID) process.exit(1);
                if (pkg.version !== process.env.VERSION) process.exit(2);
                if (pkg.dependencies || pkg.devDependencies) process.exit(3);
              });
            '

            SHA="$(tr -d '[:space:]' < "${ZIP}.sha256")"
            [[ "$SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::bad sha256 in ${ZIP}.sha256"; exit 1; }
          done

      - name: Collect release metadata
        id: meta
        working-directory: plugin
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/pdf/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## WorkStudio Office 插件 \`$VERSION\`"
            echo
            echo "| 插件 | zip | sha256 |"
            echo "| --- | --- | --- |"
            for dir in packages/*/; do
              ID="$(node -p "const p=require('./${dir}package.json'); (p.workstudio && p.workstudio.id) || ''")"
              [ -n "$ID" ] || continue
              ZIP="${ID}-${VERSION}.zip"
              SHA="$(tr -d '[:space:]' < "release/${ZIP}.sha256")"
              URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}"
              echo "| \`$ID\` | [\`$ZIP\`]($URL) | \`$SHA\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            plugin/release/*.zip
            plugin/release/*.sha256

      - name: Checkout plugin registry
        uses: actions/checkout@v7
        with:
          repository: Work-Agent/PluginRegistry
          path: PluginRegistry
          token: ${{ steps.registry-app.outputs.token }}
          fetch-depth: 0

      - name: Write plugin registry entries
        working-directory: plugin
        env:
          REGISTRY_DIR: ${{ github.workspace }}/PluginRegistry
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/write-registry-entry.mjs

      - name: Validate plugin registry
        working-directory: PluginRegistry
        run: npm run validate

      - name: Open PluginRegistry pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.registry-app.outputs.token }}
          path: PluginRegistry
          base: main
          branch: release/office-plugins-${{ steps.meta.outputs.version }}
          delete-branch: true
          commit-message: 'chore: add office plugins ${{ steps.meta.outputs.version }}'
          title: 'chore: add office plugins ${{ steps.meta.outputs.version }}'
          body: |
            Automated release from [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}).

            - Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            - Version: `${{ steps.meta.outputs.version }}`
            - 插件：`docx` / `xlsx` / `pptx` / `pdf`（每个 zip 与 sha256 见 Release）

            条目由 `scripts/write-registry-entry.mjs` 生成，`sha256` 固定本次产物。
          add-paths: |
            plugins/docx.json
            plugins/xlsx.json
            plugins/pptx.json
            plugins/pdf.json
