name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Init GenOffice vendor
        run: node scripts/setup-genoffice.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify URA contract
        run: pnpm verify

      - name: Pack plugin zips
        run: pnpm pack:plugins

      - name: Upload plugin zips
        uses: actions/upload-artifact@v4
        with:
          name: office-plugin-zips
          path: release/
          if-no-files-found: error
