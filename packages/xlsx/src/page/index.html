<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel 表格</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font: 13px/1.5 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .boot { display: grid; place-items: center; color: #6b7280; }
      .boot[data-error='1'] { color: #b91c1c; padding: 24px; text-align: center; white-space: pre-wrap; }
      .draft-banner {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
        display: flex; gap: 12px; align-items: center; z-index: 9999;
        padding: 8px 12px; border-radius: 8px; border: 1px solid #e5e7eb;
        background: #ffffff; color: #1f2328; box-shadow: 0 6px 20px rgba(15, 23, 42, .12);
      }
      .draft-banner button {
        font: inherit; padding: 2px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid #2563eb; background: #2563eb; color: #fff;
      }
      .draft-banner button.ghost { background: transparent; color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="root" class="boot">正在打开工作簿…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
