<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word 文档</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar-group">
          <button data-cmd="p" title="正文">正文</button>
          <button data-cmd="h1" title="标题 1">H1</button>
          <button data-cmd="h2" title="标题 2">H2</button>
          <button data-cmd="h3" title="标题 3">H3</button>
        </div>
        <div class="toolbar-group">
          <button data-cmd="bold" title="粗体 (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
          <button data-cmd="underline" title="下划线 (Ctrl+U)"><u>U</u></button>
          <button data-cmd="sizeUp" title="增大字号">A+</button>
          <button data-cmd="sizeDown" title="减小字号">A-</button>
        </div>
        <div class="toolbar-group">
          <button data-cmd="insert" title="在下方插入段落">插入段落</button>
          <button data-cmd="delete" title="删除当前段落">删除段落</button>
        </div>
        <div class="toolbar-group">
          <button data-cmd="undo" title="撤销 (Ctrl+Z)">撤销</button>
          <button data-cmd="redo" title="重做 (Ctrl+Shift+Z)">重做</button>
        </div>
        <div class="toolbar-group right">
          <button data-cmd="check" title="只读诊断">检查</button>
          <button data-cmd="save" class="primary" title="保存 (Ctrl+S)">保存</button>
        </div>
      </header>

      <div class="notice" id="notice" hidden></div>

      <main class="viewport" id="viewport">
        <article class="paper" id="paper">
          <div class="blocks" id="blocks"></div>
          <button class="more" id="more" type="button" disabled hidden>正在载入…</button>
        </article>
      </main>

      <footer class="statusbar">
        <span class="status-name" id="status-name">document.docx</span>
        <span class="status-item" id="status-state">载入中…</span>
        <span class="status-item" id="status-version"></span>
        <span class="status-item" id="status-epoch"></span>
        <span class="status-item" id="status-blocks"></span>
        <span class="status-grow"></span>
        <span class="status-item" id="status-tier"></span>
      </footer>
    </div>
    <script type="module" src="./assets/index.js"></script>
  </body>
</html>
